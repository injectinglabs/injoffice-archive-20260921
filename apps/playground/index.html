<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151b24" />
    <meta name="description" content="InjOffice is an AI-first, open-source alternative to Microsoft Office and Google Workspace for spreadsheets, documents, slides, and PDFs." />
    <title>InjOffice — AI-first open-source alternative to Microsoft Office and Google Workspace</title>
    <script>
      (function () {
        try {
          var param = new URLSearchParams(location.search).get('theme')
          var stored = param === 'dark' || param === 'light' ? param : localStorage.getItem('injoffice-playground-theme')
          if (param === 'dark' || param === 'light') localStorage.setItem('injoffice-playground-theme', param)
          var scheme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = scheme
          document.documentElement.style.colorScheme = scheme
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
