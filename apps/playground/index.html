<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151b24" />
    <meta name="description" content="Open-source TypeScript and Go libraries for XLSX, DOCX, PPTX, and PDF editing, with agent APIs and browser-local processing." />
    <title>InjOffice — Open-source document editing libraries</title>
    <script>
      (function () {
        try {
          var param = new URLSearchParams(location.search).get('theme')
          var stored = param === 'dark' || param === 'light' ? param : localStorage.getItem('injoffice-playground-theme')
          if (param === 'dark' || param === 'light') localStorage.setItem('injoffice-playground-theme', param)
          var scheme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = scheme
          document.documentElement.style.colorScheme = scheme
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="stylesheet" href="%BASE_URL%fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
